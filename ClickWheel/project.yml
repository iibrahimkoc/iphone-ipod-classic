name: ClickWheel
options:
  bundleIdPrefix: com.ibrahimkoc
  deploymentTarget:
    iOS: "15.0"
targets:
  ClickWheel:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: iPod
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppleMusicUsageDescription: "Müzik kütüphanendeki şarkıları çalmak için."
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Mac'teki iPod Müzik uygulamasının telefonu bulup şarkı gönderebilmesi için."
        NSBonjourServices: [_ipodmuzik._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimkoc.clickwheel
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Genesis Plus GX, built into build/lib by build.sh.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/genesis/libretro/libretro-common/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/lib
        OTHER_LDFLAGS: -lgenesis
