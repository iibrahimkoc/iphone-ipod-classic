name: iPodMuzik
options:
  bundleIdPrefix: com.ibrahimkoc
  deploymentTarget:
    macOS: "13.0"
targets:
  iPodMuzik:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: iPod Müzik
        CFBundleName: iPod Müzik
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: "Şarkıları Müzik uygulamasına eklemek için."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimkoc.ipodmuzik
        PRODUCT_NAME: iPodMuzik
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
